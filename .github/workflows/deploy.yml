name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.400

      - name: Remove stale build outputs
        run: rm -rf ./bin ./obj ./publish

      - name: Publish app
        run: dotnet publish ./EventEase.csproj -c Release -o ./publish

      - name: Verify Blazor WebAssembly integrity
        run: |
          expected=$(jq -r '.resources.wasmNative["dotnet.native.wasm"]' publish/wwwroot/_framework/blazor.boot.json)
          actual="sha256-$(openssl dgst -sha256 -binary publish/wwwroot/_framework/dotnet.native.wasm | base64 -w 0)"
          if [ "$expected" != "$actual" ]; then
            echo "WASM integrity mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Configure GitHub Pages paths
        run: |
          sed -i 's|<base href="/" />|<base href="/EventEase/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4