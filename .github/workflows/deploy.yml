name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.400

      - name: Publish app
        run: dotnet publish ./EventEase.csproj -c Release -o ./publish

      - name: Align and verify Blazor WebAssembly integrity
        run: |
          manifest=publish/wwwroot/_framework/blazor.boot.json
          wasm=publish/wwwroot/_framework/dotnet.native.wasm
          expected=$(jq -r '.resources.wasmNative["dotnet.native.wasm"]' "$manifest")
          actual="sha256-$(openssl dgst -sha256 -binary "$wasm" | base64 -w 0)"
          if [ "$expected" != "$actual" ]; then
            echo "Updating native WASM integrity hash: $expected -> $actual"
            jq --arg hash "$actual" '.resources.wasmNative["dotnet.native.wasm"] = $hash' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          fi
          verified=$(jq -r '.resources.wasmNative["dotnet.native.wasm"]' "$manifest")
          if [ "$verified" != "$actual" ]; then
            echo "WASM integrity verification failed: expected $verified, got $actual"
            exit 1
          fi

      - name: Configure GitHub Pages paths
        run: |
          sed -i 's|<base href="/" />|<base href="/EventEase/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4